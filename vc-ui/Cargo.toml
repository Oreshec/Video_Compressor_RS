[package]
name = "vc-ui"
version.workspace = true
edition = "2021"
description = "Прототип интерфейса на Slint (SPEC v0.2, Этап 1)"
publish = false
license = "GPL-3.0-only"

[dependencies]
slint = "1.18"
rfd = "0.17"
self_update = { version = "1", default-features = false, features = ["github", "reqwest", "native-tls"] }
vc-core = { path = "../vc-core" }

# Drag&drop из ОС: Slint 1.x пока не передаёт WM_DROPFILES (см. src/win_drop.rs).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
# Полноценный OLE-приёмник IDropTarget (Explorer отдаёт файлы именно через OLE;
# WM_DROPFILES — легаси-фолбэк, поэтому одного windows-sys недостаточно).
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Ole",
    "Win32_System_SystemServices",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "implement",
] }
# Макрос #[implement] генерирует код с прямыми путями windows_core.
windows-core = "0.58"

[build-dependencies]
slint-build = "1.18"
